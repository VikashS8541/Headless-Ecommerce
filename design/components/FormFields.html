<!doctype html><html lang="en" data-theme="light"><head><title>Aurelo · FormFields</title><link rel="stylesheet" href="../css/tokens.css"><link rel="stylesheet" href="../css/components.css"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head><body class=""><div class="grid g3" style="gap:24px 32px">
<div class="field"><label>Email address</label><input class="input" placeholder="you@example.com"><span class="hint">We send your receipt here.</span></div>
<div class="field"><label>Email address (focus)</label><input class="input is-focus" value="anaya@example.com"></div>
<div class="field"><label>Email address (valid)</label><input class="input is-ok" value="anaya.mehta@example.com"><span class="msg ok"><svg class="ic " width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 5 5 9-10"/></svg>Looks good</span></div>
<div class="field"><label>Mobile number</label><input class="input is-error" value="98765"><span class="msg err"><svg class="ic " width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v6M12 16.500v.5"/></svg>Enter a 10-digit mobile number.</span></div>
<div class="field"><label>Coupon code (disabled)</label><input class="input is-disabled" disabled value="WELCOME10"></div>
<div class="field"><label>State</label><select class="select"><option>Maharashtra</option></select></div>
<div class="field" style="grid-column:span 3"><label>Message</label><textarea class="textarea" placeholder="How can we help?"></textarea></div></div>
<div class="grid g3 mt-6" style="gap:32px"><div class="col gap-3"><span class="cap">Checkbox</span><label class="chk"><input type="checkbox" checked>Remember me</label><label class="chk"><input type="checkbox">I agree to the Terms and Conditions</label><label class="chk"><input type="checkbox" disabled>Unavailable</label></div>
<div class="col gap-3"><span class="cap">Radio</span><label class="chk"><input type="radio" name="r" checked>Standard · ₹99</label><label class="chk"><input type="radio" name="r">Express · ₹199</label></div>
<div class="col gap-3"><span class="cap">Option card</span><label class="opt is-sel"><input type="radio" class="chk" checked><span class="grow"><b>UPI, cards, netbanking</b><br><span class="sm muted">Secure online payment</span></span><svg class="ic " width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="6" width="18" height="12" rx="2"/><path d="M3 10h18"/></svg></label><label class="opt"><input type="radio"><span class="grow"><b>Cash on delivery</b><br><span class="sm muted">₹49 fee · up to ₹10,000</span></span><svg class="ic " width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="7" width="18" height="10" rx="2"/><circle cx="12" cy="12" r="2.500"/></svg></label></div></div></body></html>
